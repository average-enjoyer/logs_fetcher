name: log_harvester
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: "Oleksii Maksymov <maksimov98gmy@gmail.com>"
description: |
  Interactive terminal UI for extracting log files by date range,
  from the local filesystem or a remote server over SSH.
homepage: https://github.com/average-enjoyer/LogHarvester

contents:
  - src: ./dist/log_harvester
    dst: /usr/bin/log_harvester
    file_info:
      mode: 0755
  - src: ./packaging/log_harvester.desktop
    dst: /usr/share/applications/log_harvester.desktop
